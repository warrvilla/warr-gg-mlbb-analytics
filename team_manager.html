<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Manager — Warr.GG</title>
<link rel="stylesheet" href="warr-styles.css">
<style>
:root { --nav-h: 52px; }
body { background: var(--bg); min-height: 100vh; }
.page-wrap { max-width: 1080px; margin: 0 auto; padding: calc(var(--nav-h) + 32px) 20px 80px; }

.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
}
.page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
.page-sub   { font-size: 13px; color: var(--text3); margin-top: 3px; }

/* ── Layout ── */
.two-col { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
@media(max-width:760px){ .two-col { grid-template-columns: 1fr; } }

/* ── Card ── */
.card {
  background: var(--surface); border: 1px solid var(--glass-border2);
  border-radius: var(--r2); padding: 20px;
}
.card-title {
  font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}

/* ── Team list ── */
.team-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.team-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: var(--r);
  background: var(--surface2); border: 1px solid transparent;
  cursor: pointer; gap: 8px; transition: border-color .15s;
}
.team-item:hover { border-color: var(--border2); }
.team-item.active { background: var(--accent-dim); border-color: var(--accent-border); }
.team-item-name { font-size: 13px; font-weight: 600; color: var(--text); }
.team-item-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.team-lock { font-size: 10px; color: var(--gold); }

/* ── Buttons ── */
.btn {
  padding: 8px 16px; border-radius: var(--r); font-size: 12px; font-weight: 700;
  border: 1px solid transparent; cursor: pointer; font-family: var(--font-head);
  letter-spacing: .03em; transition: opacity .15s; white-space: nowrap;
}
.btn:hover { opacity: .85; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-accent { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
.btn-green  { background: var(--neon-dim);   color: var(--neon);   border-color: var(--neon-border);   }
.btn-red    { background: var(--red-dim);    color: var(--red);    border-color: var(--red-border);    }
.btn-gold   { background: var(--gold-dim);   color: var(--gold);   border-color: var(--gold-border);   }
.btn-ghost  { background: var(--surface3);   color: var(--text2);  border-color: var(--border2);       }
.btn-sm { padding: 5px 12px; font-size: 11px; }

/* ── Form ── */
.form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.form-input {
  flex: 1; min-width: 120px; padding: 8px 12px;
  background: var(--surface3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-size: 13px;
  font-family: var(--font-body); outline: none;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--text3); }
.form-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: block; }

/* ── Team detail header ── */
.team-detail-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px; flex-wrap: wrap;
}
.team-detail-name { font-size: 20px; font-weight: 800; color: var(--text); }
.team-detail-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.tab-btn {
  padding: 8px 16px; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  background: none; border: none; cursor: pointer; color: var(--text3);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--font-head);
  transition: color .15s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover { color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Player roster ── */
.roster-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.player-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface2); border: 1px solid var(--glass-border);
  border-radius: var(--r); padding: 12px 14px;
}
.player-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface3); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: var(--accent); flex-shrink: 0;
}
.player-info { flex: 1; min-width: 0; }
.player-ign  { font-size: 13px; font-weight: 700; color: var(--text); }
.player-real { font-size: 11px; color: var(--text3); }
.player-status {
  padding: 2px 8px; border-radius: var(--pill); font-size: 10px; font-weight: 700;
}
.player-status.active   { background: var(--neon-dim);  color: var(--neon);  border: 1px solid var(--neon-border); }
.player-status.inactive { background: var(--surface3); color: var(--text3); border: 1px solid var(--border2); }
.role-badge {
  padding: 2px 8px; border-radius: var(--pill); font-size: 10px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  background: var(--surface3); color: var(--text3); border: 1px solid var(--border2);
}
.role-badge.Gold   { background: rgba(200,144,80,.15);  color: #C89050; border-color: rgba(200,144,80,.35); }
.role-badge.Jungle { background: rgba(76,184,122,.15);  color: #4CB87A; border-color: rgba(76,184,122,.35); }
.role-badge.Mid    { background: rgba(124,92,246,.15); color: #7C5CF6; border-color: rgba(124,92,246,.35); }
.role-badge.EXP    { background: rgba(94,160,216,.15);  color: #5EA0D8; border-color: rgba(94,160,216,.35); }
.role-badge.Roam   { background: rgba(216,120,128,.15); color: #D87880; border-color: rgba(216,120,128,.35); }
.role-select {
  padding: 4px 8px; background: var(--surface3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-size: 11px; font-weight: 600;
  cursor: pointer;
}
.player-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

/* ── Hero pool table ── */
.pool-filters {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center;
}
.pool-filter-select {
  padding: 6px 10px; background: var(--surface3); border: 1px solid var(--border2);
  border-radius: var(--r); color: var(--text); font-size: 12px;
  font-family: var(--font-body); outline: none; cursor: pointer;
}
.pool-filter-select:focus { border-color: var(--accent); }

.player-select-btn {
  padding: 6px 12px; border-radius: var(--r); background: var(--surface3);
  border: 1px solid var(--border2); color: var(--text2); font-size: 12px;
  font-weight: 600; cursor: pointer; font-family: var(--font-head);
  transition: border-color .15s;
}
.player-select-btn.selected { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

.hero-pool-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.hero-pool-table th {
  text-align: left; padding: 8px 10px; font-size: 10px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--text3);
  border-bottom: 1px solid var(--glass-border);
}
.hero-pool-table td {
  padding: 9px 10px; border-bottom: 1px solid var(--border);
  color: var(--text2); vertical-align: middle;
}
.hero-pool-table tr:last-child td { border-bottom: none; }
.hero-pool-table tr:hover td { background: var(--surface2); }

.hero-name-cell { color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.hero-portrait {
  width: 24px; height: 24px; border-radius: 6px; object-fit: cover;
  background: var(--surface3);
}
.lane-badge {
  display: inline-block; padding: 2px 7px; border-radius: var(--pill);
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
}
.wr-bar-wrap { display: flex; align-items: center; gap: 8px; }
.wr-bar { height: 4px; border-radius: var(--pill); background: var(--surface3); width: 80px; overflow: hidden; }
.wr-bar-fill { height: 100%; border-radius: var(--pill); }

/* ── Empty ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }
.empty-icon  { font-size: 32px; margin-bottom: 8px; }

/* ── Add player form inline ── */
.add-player-form {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r2); padding: 16px; margin-top: 4px;
}
.add-player-form .form-row { margin-bottom: 8px; }

/* ── Toast ── */
.toast-msg {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--r); padding: 10px 20px; font-size: 13px; color: var(--text);
  transition: transform .3s ease; z-index: 9999; white-space: nowrap;
  box-shadow: var(--shadow);
}

/* ═══ TEAMS PAGE — front-page design language ═══ */
.tm-hd{text-align:center;margin:6px 0 22px;position:relative;}
.tm-hd::before{content:'';position:absolute;left:50%;top:-50px;transform:translateX(-50%);
  width:520px;height:220px;max-width:90vw;border-radius:50%;
  background:radial-gradient(ellipse,rgba(124,92,246,.14) 0%,rgba(94,92,230,.06) 45%,transparent 72%);
  pointer-events:none;}
.tm-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;
  background:rgba(124,92,246,.08);border:0.5px solid rgba(124,92,246,.3);
  font-family:var(--font-mono,monospace);font-size:8.5px;font-weight:700;letter-spacing:.18em;
  color:#7C5CF6;margin-bottom:10px;text-transform:uppercase;}
.tm-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;}
.tm-title{font-family:var(--font-display,-apple-system);font-weight:900;font-size:32px;line-height:1;
  letter-spacing:-0.02em;color:var(--text);}
.tm-title em{font-style:normal;background:linear-gradient(135deg,#7C5CF6 0%,#5E5CE6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.tm-sub{font-size:12px;color:rgba(240,240,248,.5);margin-top:8px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.5;}
/* silk-glass cards */
.card{background:var(--glass,rgba(16,16,26,.68)) !important;
  backdrop-filter:var(--blur-sm,blur(24px));-webkit-backdrop-filter:var(--blur-sm,blur(24px));
  border:0.5px solid var(--glass-border,rgba(255,255,255,.07)) !important;border-radius:18px !important;
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);position:relative;}
.card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--glass-shine,rgba(255,255,255,.11)),transparent);pointer-events:none;border-radius:18px 18px 0 0;}
.team-list>*{transition:transform .12s ease;}
.team-list>*:hover{transform:translateX(2px);}
</style>
<style id="tm-v2">
/* ═══ Teams v2 — tile browser + team profile ═══ */
.page-wrap{max-width:1120px !important;padding-top:28px !important;}
.toast-msg:empty{opacity:0;}
.tm-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.tm-h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--text);}
.tm-h2{font-size:13px;color:var(--text3);margin-top:3px;}
.tm-top-r{display:flex;gap:8px;}
.tm-filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.tm-frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tm-frow .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);width:52px;flex-shrink:0;}
.tm-chips{display:flex;gap:6px;flex-wrap:wrap;}
.tm-chip{padding:5px 12px;border-radius:9999px;font-size:12px;font-weight:500;border:0.5px solid rgba(255,255,255,.09);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s;}
.tm-chip:hover{color:var(--text);background:rgba(255,255,255,.05);}
.tm-chip.on{background:rgba(124,92,246,.16);border-color:rgba(124,92,246,.4);color:var(--text);}
.tm-chip .cur{font-size:9.5px;color:var(--neon,#34D399);margin-left:5px;font-weight:600;}
.tm-search{max-width:320px;margin-top:2px;}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.tm-tile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:rgba(16,16,26,.68);border:0.5px solid rgba(255,255,255,.07);cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:background .15s,border-color .15s,transform .15s;position:relative;}
.tm-tile:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);transform:translateY(-1px);}
.tm-tile .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-tile .sub{font-size:11.5px;color:var(--text3);margin-top:2px;}
.tm-tile .rk{position:absolute;top:10px;right:12px;font-size:10.5px;font-family:var(--font-mono,monospace);color:var(--text3);}
.tm-tile .lock{font-size:10px;margin-left:4px;}
.tm-tile .form{display:flex;gap:3px;margin-top:6px;}
.tm-tile .form i{width:6px;height:6px;border-radius:50%;display:block;}
.tm-empty{grid-column:1/-1;padding:24px;text-align:center;font-size:12.5px;color:var(--text3);}
.tm-addform{margin-top:14px;max-width:420px;}
.tm-logo{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;position:relative;font-weight:800;color:#fff;border-radius:12px;}
.tm-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
.tm-logo i{font-style:normal;display:none;}
.tm-logo.noimg{background:var(--mc,#5E5CE6);} .tm-logo.noimg img{display:none;} .tm-logo.noimg i{display:inline;}
.tm-back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:9999px;border:0.5px solid rgba(255,255,255,.09);background:transparent;color:var(--text2);cursor:pointer;font:inherit;font-size:12.5px;margin-bottom:12px;}
.tm-back:hover{color:var(--text);background:rgba(255,255,255,.05);}
.tm-hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:20px;border-radius:22px;background:rgba(16,16,26,.68);border:0.5px solid rgba(255,255,255,.07);box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);margin-bottom:14px;}
.tm-hero .name{font-size:26px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tm-hero .scope{font-size:12px;color:var(--text3);margin-top:2px;}
.tm-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px;}
.tm-stat .v{font-size:19px;font-weight:800;letter-spacing:-.01em;}
.tm-stat .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-top:1px;}
.tm-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;}
.tm-actions .btn{justify-content:center;}
.tm-sec{background:rgba(16,16,26,.68);border:0.5px solid rgba(255,255,255,.07);border-radius:18px;padding:16px;margin-bottom:14px;}
.tm-sec h3{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:8px;}
.tm-sec h3 .n{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--text3);font-size:11px;font-family:var(--font-mono,monospace);}
.tm-lineup{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.tm-lane{border-radius:14px;padding:12px;background:rgba(255,255,255,.025);border:0.5px solid rgba(255,255,255,.06);border-top:2px solid var(--lc);}
.tm-lane .ln{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lc);}
.tm-lane .pl{font-size:14px;font-weight:700;margin:3px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tm-lane .hr{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
.tm-lane .hr img{width:26px;height:26px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.05);}
.tm-lane .hr .rec{margin-left:auto;font-family:var(--font-mono,monospace);font-size:10.5px;color:var(--text3);}
.tm-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tm-lv{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.05);}
.tm-lv:last-child{border-bottom:none;}
.tm-lv img{width:24px;height:24px;border-radius:7px;object-fit:cover;flex-shrink:0;}
.tm-lv .t{font-size:12.5px;font-weight:700;}
.tm-lv .w{font-size:11px;color:var(--text3);line-height:1.5;margin-top:1px;}
.tm-cf{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;border-radius:5px;padding:1px 5px;margin-left:5px;opacity:.85;}
.tm-games .g{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.05);}
.tm-games .g:last-child{border-bottom:none;}
.tm-wl{font-size:11px;font-weight:800;text-align:center;border-radius:8px;padding:4px 0;}
.tm-wl.w{color:#34D399;background:rgba(52,211,153,.1);} .tm-wl.l{color:#E58A92;background:rgba(216,120,128,.1);}
.tm-games .vs{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;font-weight:600;}
.tm-games .vs span.m{font-size:11px;color:var(--text3);font-weight:400;}
.tm-games .pk{display:flex;gap:3px;}
.tm-games .pk img{width:24px;height:24px;border-radius:7px;object-fit:cover;background:rgba(255,255,255,.05);}
.tm-tempo{display:flex;gap:8px;flex-wrap:wrap;}
.tm-tempo span{font-size:11.5px;color:var(--text2);padding:5px 10px;border-radius:9999px;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.07);}
.tm-ph{display:flex;gap:4px;margin-left:auto;}
.tm-ph img{width:22px;height:22px;border-radius:6px;object-fit:cover;background:rgba(255,255,255,.05);}
.player-row{display:flex;align-items:center;gap:10px;}
.tm-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
@media(max-width:900px){.tm-lineup{grid-template-columns:repeat(2,1fr);} .tm-2col{grid-template-columns:1fr;} .tm-hero{grid-template-columns:auto 1fr;} .tm-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;}}
@media(max-width:520px){.tm-lineup{grid-template-columns:1fr;} .tm-hero{grid-template-columns:1fr;text-align:left;} .tm-games .pk{display:none;} .tm-ph{display:none;}}
</style>
</head>
<body>

<!-- NAV -->
<div id="warr-nav-root"></div><div class="page-wrap">

  <!-- HEADER -->
  <div class="tm-top">
    <div>
      <h1 class="tm-h1">Teams</h1>
      <div class="tm-h2">Lineups, form and hero pools for every scouted team.</div>
    </div>
    <div class="tm-top-r">
      <button class="btn btn-ghost" id="viewTeamsBtn" onclick="setViewMode('teams')" style="display:none;">By team</button>
      <button class="btn btn-ghost" id="viewPlayersBtn" onclick="setViewMode('players')" style="display:none;">All players</button>
      <button class="btn btn-accent" id="addTeamBtn" onclick="openAddTeam()" style="display:none;">+ Add team</button>
    </div>
  </div>

  <!-- All Players view -->
  <div id="allPlayersView" style="display:none;">
    <div class="card">
      <div class="card-title">ALL PLAYERS</div>
      <input class="form-input" id="playerSearch" placeholder="Search player IGN or team…" oninput="renderAllPlayers()" style="margin-bottom:14px;width:100%;box-sizing:border-box;" />
      <div id="allPlayersList"></div>
    </div>
  </div>

  <div id="teamsView">
    <!-- Browse: league → season → team tiles -->
    <div id="tmBrowse">
      <div class="tm-filters">
        <div class="tm-frow"><span class="k">League</span><div id="tmLeagueRow" class="tm-chips"></div></div>
        <div class="tm-frow"><span class="k">Season</span><div id="tmSeasonRow" class="tm-chips"></div></div>
        <input class="form-input tm-search" id="teamSearch" placeholder="Search teams…" oninput="renderTeamList()" autocomplete="off" />
      </div>
      <div class="tm-grid" id="teamList"><div class="tm-empty">Loading teams…</div></div>
      <!-- Add team form (admin only) -->
      <div id="addTeamForm" class="card tm-addform" style="display:none;">
        <div class="card-title">NEW TEAM</div>
        <div class="form-row"><input class="form-input" id="newTeamName" placeholder="Team name (e.g. ECHO)" /></div>
        <div class="form-row"><input class="form-input" id="newTeamRegion" placeholder="Region (optional)" /></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-green btn-sm" onclick="saveNewTeam()">Save</button>
          <button class="btn btn-ghost btn-sm" onclick="closeAddTeam()">Cancel</button>
        </div>
      </div>
    </div>
    <!-- Profile of the selected team -->
    <div id="teamDetail" style="display:none;"></div>
  </div><!-- /teamsView -->
</div>

<div id="toastMsg" class="toast-msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="warr-lib.js?v=3"></script>
<script src="warr-intel.js?v=6"></script>
<script src="warr-nav.js"></script>
<script>
// ── Auth + permission init ────────────────────────────────────
let _isAdmin = false;
let _isVerified = false;
let _myTeam = null;

(async () => {
  if (typeof WAuth !== 'undefined') {
    await WAuth.restoreSession?.();
    WAuth.renderAuthChip?.('navRight');
    if (typeof WAdmin !== 'undefined') await WAdmin.loadExtraAdmins?.();
  }
  _isAdmin    = WAdmin.isAdmin();
  _isVerified = WAdmin.isVerifiedTeam();
  _myTeam     = WAdmin.myTeamName();

  // Everyone can view — edit controls are shown/hidden per permission inside renderTeamDetail
  if (_isAdmin) document.getElementById('addTeamBtn').style.display = 'inline-block';
  await loadAll();
})();

// ── State ─────────────────────────────────────────────────────
let allTeams   = [];   // { team_name, region, player_count }
let allPlayers = [];   // flat list from DB
let allMatches = [];   // for hero pool computation
let leagues    = [];
let seasons    = [];
let activeTeam = null; // currently selected team_name

let poolFilter = { playerId: null, source: 'all', league: '', season: '' };
let _rosterSeason = '';   // currently-selected season on the roster tab
let _teamRoster = [];     // team_rosters rows for the active team (all seasons)

// ── Load ──────────────────────────────────────────────────────
async function loadAll() {
  try {
    [allPlayers, allMatches, leagues] = await Promise.all([
      WDB.loadPlayers(),
      WDB.loadMatches(),
      WDB.loadLeagues(),
    ]);
    // Build unique team list from players + existing scout match teams
    buildTeamList();
    renderTeamList();
  } catch(e) {
    toast('Load error: ' + e.message, 'error');
  }
}

function buildTeamList() {
  // Collect team names from players table
  const teamMap = {};
  allPlayers.forEach(p => {
    if (!teamMap[p.team_name]) teamMap[p.team_name] = { team_name: p.team_name, region: '', player_count: 0 };
    teamMap[p.team_name].player_count++;
  });
  // Also surface teams from match data that have no players yet
  allMatches.forEach(m => {
    [m.blueTeam, m.redTeam].forEach(t => {
      if (t && !teamMap[t]) teamMap[t] = { team_name: t, region: '', player_count: 0 };
    });
  });
  allTeams = Object.values(teamMap).sort((a,b) => a.team_name.localeCompare(b.team_name));
  _loadTmLeagues();
}

// ── View mode (by team / all players) ────────────────────────
let viewMode = 'teams';
function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('teamsView').style.display     = mode === 'teams'   ? '' : 'none';
  document.getElementById('allPlayersView').style.display = mode === 'players' ? '' : 'none';
  document.getElementById('viewTeamsBtn').className   = 'btn ' + (mode === 'teams'   ? 'btn-accent' : 'btn-ghost');
  document.getElementById('viewPlayersBtn').className = 'btn ' + (mode === 'players' ? 'btn-accent' : 'btn-ghost');
  if (mode === 'players') renderAllPlayers();
}

// ── All players view ──────────────────────────────────────────
function renderAllPlayers() {
  const q = (document.getElementById('playerSearch')?.value || '').toLowerCase();
  const el = document.getElementById('allPlayersList');
  const filtered = allPlayers.filter(p =>
    !q || p.ign.toLowerCase().includes(q) || (p.real_name||'').toLowerCase().includes(q) || p.team_name.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>No players found.</div></div>';
    return;
  }
  el.innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead><tr>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Player</th>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Team</th>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Role</th>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Status</th>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Top Heroes</th>
        <th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);">Games Tagged</th>
        <th style="text-align:right;padding:8px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--glass-border);"></th>
      </tr></thead>
      <tbody>
        ${filtered.map(p => {
          const { total, games } = WDB.computePlayerHeroPool(allMatches, p.ign);
          const topHeroes = Object.entries(total)
            .sort((a,b) => b[1].games - a[1].games)
            .slice(0, 3)
            .map(([hero, s]) => {
              const wr = s.games ? Math.round(s.wins/s.games*100) : 0;
              const heroId = hero.toLowerCase().replace(/[^a-z0-9]/g,'');
              return `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:6px;">
                <img src="./portraits/${heroId}.png" onerror="this.style.display='none'" style="width:20px;height:20px;border-radius:5px;object-fit:cover;background:var(--surface3);">
                <span style="color:var(--text);font-weight:600;">${esc(hero)}</span>
                <span style="color:${wr>=60?'var(--neon)':wr>=50?'var(--text3)':'var(--red)'};font-size:11px;">${wr}%</span>
              </span>`;
            }).join('');
          return `<tr style="border-bottom:1px solid var(--border);cursor:pointer;" onclick="viewPlayerDetail('${esc(p.id)}')">
            <td style="padding:10px 10px;">
              <div style="font-weight:700;color:var(--text);">${esc(p.ign)}</div>
              ${p.real_name ? `<div style="font-size:11px;color:var(--text3);">${esc(p.real_name)}</div>` : ''}
            </td>
            <td style="padding:10px 10px;color:var(--text2);">${esc(p.team_name)}</td>
            <td style="padding:10px 10px;">
              ${p.role ? `<span class="role-badge ${p.role}">${p.role}</span>` : `<span style="color:var(--text3);font-size:11px;">—</span>`}
            </td>
            <td style="padding:10px 10px;">
              <span style="padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;
                ${p.is_active!==false ? 'background:var(--neon-dim);color:var(--neon);border:1px solid var(--neon-border);' : 'background:var(--surface3);color:var(--text3);border:1px solid var(--border2);'}">
                ${p.is_active!==false ? 'Active' : 'Former'}
              </span>
            </td>
            <td style="padding:10px 10px;">${topHeroes || '<span style="color:var(--text3);font-size:11px;">No data yet</span>'}</td>
            <td style="padding:10px 10px;color:var(--text3);">${games}</td>
            <td style="padding:10px 10px;text-align:right;">
              <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();viewPlayerDetail('${esc(p.id)}')">View Pool →</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function viewPlayerDetail(playerId) {
  const player = allPlayers.find(p => p.id === playerId);
  if (!player) return;
  // Switch to team view, select that team, then pick the player in the pool tab
  setViewMode('teams');
  selectTeam(player.team_name).then(() => {
    poolFilter.playerId = playerId;
    // Switch to pool tab
    const poolBtn = document.querySelector('.tab-btn[data-tab="pool"]');
    if (poolBtn) switchTab('pool', player.team_name, poolBtn);
    // Render pool
    const content = document.getElementById('heroPoolContent');
    if (content) content.innerHTML = renderHeroPool();
    // Highlight the player button
    document.querySelectorAll('.player-select-btn').forEach(b => {
      b.classList.toggle('selected', b.getAttribute('onclick')?.includes(playerId));
    });
  });
}

// ── Render team list ──────────────────────────────────────────
// ── LEAGUE FILTER — which league each team appears in (from scout matches) ──
let tmLeagueFilter = (function(){
  try { const dm = (typeof WDB!=='undefined'&&WDB.defaultMeta)?WDB.defaultMeta():null;
    if (dm && dm.league && dm.league!=='all') return dm.league; } catch(_){}
  try { return (WDB.officialLeagues&&WDB.officialLeagues()[0]) || 'MPL PH'; } catch(_){ return 'MPL PH'; }
})();
let _tmTeamLeagues = null; // name → Set(league)
async function _loadTmLeagues() {
  if (_tmTeamLeagues) return _tmTeamLeagues;
  _tmTeamLeagues = {};
  try {
    const matches = await WDB.loadMatches();
    (matches || []).forEach(m => {
      [m.blueTeam, m.redTeam].forEach(n => {
        if (!n) return;
        (_tmTeamLeagues[n] = _tmTeamLeagues[n] || new Set()).add(m.league || '');
      });
    });
  } catch(_) {}
  renderTmLeagueChips();
  renderTeamList();
  return _tmTeamLeagues;
}
function renderTmLeagueChips() {
  const row = document.getElementById('tmLeagueRow');
  if (!row) return;
  const leagues = (typeof WDB !== 'undefined' && WDB.officialLeagues) ? WDB.officialLeagues() : [];
  // only leagues that actually have teams in the data (plus the current one)
  const has = l => !_tmTeamLeagues || Object.values(_tmTeamLeagues).some(set => set.has(l));
  const list = leagues.filter(l => has(l) || l === tmLeagueFilter);
  row.innerHTML = list.map(n => `<button class="tm-chip${tmLeagueFilter===n?' on':''}" onclick="setTmLeague(${_tmArg(n)})">${esc(n)}</button>`).join('')
    + (has('Scrims') ? `<button class="tm-chip${tmLeagueFilter==='Scrims'?' on':''}" onclick="setTmLeague('Scrims')">My scrims</button>` : '')
    + `<button class="tm-chip${tmLeagueFilter==='all'?' on':''}" onclick="setTmLeague('all')">All teams</button>`;
  renderTmSeasonChips();
}
const _tmArg = v => esc(JSON.stringify(String(v)));
let tmSeason = null;   // null = this league's current (latest) season
function _tmSeasons() {
  if (tmLeagueFilter === 'all' || tmLeagueFilter === 'Scrims') return [];
  return [...new Set((allMatches||[]).filter(m => m.league === tmLeagueFilter).map(m => (m.season||'').trim()).filter(Boolean))]
    .sort((a,b) => b.localeCompare(a, undefined, {numeric:true}));
}
function _tmCurSeason() { const ss = _tmSeasons(); return tmSeason === null ? (ss[0] || '') : tmSeason; }
function renderTmSeasonChips() {
  const row = document.getElementById('tmSeasonRow'); if (!row) return;
  const ss = _tmSeasons(), cur = _tmCurSeason();
  row.parentElement.style.display = ss.length ? '' : 'none';
  row.innerHTML = ss.map((x, i) => `<button class="tm-chip${cur===x?' on':''}" onclick="setTmSeason(${_tmArg(x)})">${esc(x)}${i===0?'<span class="cur">current</span>':''}</button>`).join('')
    + `<button class="tm-chip${cur===''?' on':''}" onclick="setTmSeason('')">All seasons</button>`;
}
function setTmSeason(x) { tmSeason = x; renderTmSeasonChips(); renderTeamList(); }
// Matches in the chosen league + season (official), or your scrims.
function _tmPool() {
  const ms = (allMatches||[]).filter(m => m && m.blueTeam && m.redTeam && (m.winner==='blue'||m.winner==='red'));
  if (tmLeagueFilter === 'Scrims') return ms.filter(m => m.league === 'Scrims');
  if (tmLeagueFilter === 'all') return ms.filter(m => m.league !== 'Scrims' && !/ai battle|^other$/i.test(m.league||''));
  const se = _tmCurSeason();
  return ms.filter(m => m.league === tmLeagueFilter && (!se || (m.season||'').trim() === se));
}
let _tmStatsKey = '', _tmStatsVal = null;
function _tmStats() {
  const pool = _tmPool();
  const key = [tmLeagueFilter, _tmCurSeason(), pool.length].join('|');
  if (_tmStatsKey === key && _tmStatsVal) return _tmStatsVal;
  const rec = {};
  pool.sort((a,b) => (Date.parse(a.date||'')||0) - (Date.parse(b.date||'')||0)).forEach(m => [['blue', m.blueTeam], ['red', m.redTeam]].forEach(([sd, t]) => {
    const x = rec[t] || (rec[t] = { w: 0, l: 0, form: [] }); const won = m.winner === sd;
    if (won) x.w++; else x.l++; x.form.push(won ? 'W' : 'L');
  }));
  let R = null; try { if (window.WIntel) R = WIntel.ratings(pool); } catch(_) {}
  const order = Object.keys(rec).sort((a,b) => ((R && R.r[b]) || 0) - ((R && R.r[a]) || 0));
  order.forEach((t, i) => { rec[t].rank = i + 1; });
  _tmStatsKey = key; _tmStatsVal = { rec, R, pool, n: order.length };
  return _tmStatsVal;
}
function tmLogo(name, size) {
  const mg = (WDB.teamMonogram ? WDB.teamMonogram(name) : { init: '?', color: '#5E5CE6' });
  const src = WDB.teamLogo ? WDB.teamLogo(name) : '';
  return `<span class="tm-logo${src?'':' noimg'}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.32)}px;--mc:${mg.color};">${src?`<img src="${src}" alt="" loading="lazy" onerror="this.parentNode.classList.add('noimg')">`:''}<i>${esc(mg.init)}</i></span>`;
}
function tmHeroImg(h, cls) {
  const src = WDB.heroPortrait ? WDB.heroPortrait(h) : '';
  const png = WDB.heroPortraitPng ? WDB.heroPortraitPng(h) : '';
  return `<img ${cls?`class="${cls}"`:''} src="${src}" alt="${esc(h)}" title="${esc(h)}" loading="lazy" onerror="if(!this.dataset.f&&'${png}'){this.dataset.f=1;this.src='${png}';}else{this.style.visibility='hidden';}">`;
}
function setTmLeague(l) {
  tmLeagueFilter = l;
  tmSeason = null;
  renderTmLeagueChips();
  renderTeamList();
  if (!_tmTeamLeagues) _loadTmLeagues();
}
window.addEventListener('warr-leagues-ready', renderTmLeagueChips);

function renderTeamList() {
  const el = document.getElementById('teamList');
  if (!el) return;
  const q  = (document.getElementById('teamSearch')?.value || '').toLowerCase();
  if (!allTeams.length) { el.innerHTML = '<div class="tm-empty">No teams yet.</div>'; return; }
  let visible = q ? allTeams.filter(t => t.team_name.toLowerCase().includes(q)) : allTeams;
  if (tmLeagueFilter !== 'all' && _tmTeamLeagues) {
    visible = visible.filter(t => _tmTeamLeagues[t.team_name] && _tmTeamLeagues[t.team_name].has(tmLeagueFilter));
  }
  if (!visible.length) {
    el.innerHTML = `<div class="tm-empty">${q ? `No team matches “${esc(q)}”.` : `No teams with ${esc(tmLeagueFilter)} matches yet.`}</div>`;
    return;
  }
  const st = _tmStats();
  visible = [...visible].sort((a, b) => {
    const ra = st.rec[a.team_name], rb = st.rec[b.team_name];
    if (ra && rb) return ra.rank - rb.rank;
    if (ra || rb) return ra ? -1 : 1;
    return a.team_name.localeCompare(b.team_name);
  });
  const scopeTxt = tmLeagueFilter === 'Scrims' ? 'in your scrims' : (tmLeagueFilter === 'all' ? 'all leagues' : (_tmCurSeason() || 'all seasons'));
  el.innerHTML = visible.map(t => {
    const r = st.rec[t.team_name];
    const lockd = (WDB.isTeamLocked && WDB.isTeamLocked(t.team_name));
    const form = r ? r.form.slice(-5).map(x => `<i style="background:${x==='W'?'#34D399':'#E58A92'};"></i>`).join('') : '';
    return `<button class="tm-tile" onclick="selectTeam(${_tmArg(t.team_name)})">
      ${tmLogo(t.team_name, 46)}
      <span style="min-width:0;flex:1;">
        <span class="nm" style="display:block;">${esc(t.team_name)}${lockd?'<span class="lock" title="Locked">🔒</span>':''}</span>
        <span class="sub" style="display:block;">${r ? `${r.w}-${r.l} · ${Math.round(r.w/Math.max(1,r.w+r.l)*100)}% ${esc(scopeTxt)}` : `No games ${esc(scopeTxt)}`}${t.player_count?` · ${t.player_count} players`:''}</span>
        ${form ? `<span class="form">${form}</span>` : ''}
      </span>
      ${r && tmLeagueFilter!=='all' && tmLeagueFilter!=='Scrims' ? `<span class="rk">#${r.rank}</span>` : ''}
    </button>`;
  }).join('');
}

function tmBack() {
  activeTeam = null;
  document.getElementById('teamDetail').style.display = 'none';
  document.getElementById('tmBrowse').style.display = '';
  renderTeamList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Select team ───────────────────────────────────────────────
async function selectTeam(teamName) {
  activeTeam = teamName;
  poolFilter = { playerId: null, source: 'all', league: '', season: '' }; // reset on team switch
  _rosterSeason = '';
  document.getElementById('tmBrowse').style.display = 'none';
  document.getElementById('teamDetail').style.display = '';
  window.scrollTo({ top: 0 });
  try { _teamRoster = await WDB.loadTeamRoster(teamName); } catch(e) { _teamRoster = []; }
  // Default to the most recent season this team has (roster or matches).
  _rosterSeason = _teamRosterSeasons(teamName)[0] || '';
  renderTeamDetail(teamName);
  try { seasons = await WDB.loadSeasons(); } catch(e) {}
}

// ── Team profile: which matches describe this team right now ──
function _tmTeamScope(teamName) {
  const ms = (allMatches||[]).filter(m => m && (m.winner==='blue'||m.winner==='red') && m.league !== 'Scrims' && !/ai battle|^other$/i.test(m.league||''));
  const mine = ms.filter(m => m.blueTeam===teamName || m.redTeam===teamName).sort((a,b) => (Date.parse(b.date||'')||0) - (Date.parse(a.date||'')||0));
  let league = (tmLeagueFilter !== 'all' && tmLeagueFilter !== 'Scrims' && mine.some(m => m.league===tmLeagueFilter)) ? tmLeagueFilter : (mine[0]?.league || '');
  const ss = [...new Set(ms.filter(m => m.league===league).map(m => (m.season||'').trim()).filter(Boolean))].sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
  let season = (league===tmLeagueFilter && tmSeason !== null) ? tmSeason : (ss[0] || '');
  const seasons = season ? [season] : [];
  const inS = m => m.league===league && (!seasons.length || seasons.includes((m.season||'').trim()));
  if (season && mine.filter(inS).length < 5 && ss[ss.indexOf(season)+1]) seasons.push(ss[ss.indexOf(season)+1]);
  return { league, seasons, label: `${league}${seasons.length?' '+seasons.join(' + '):''}`, pool: ms.filter(inS) };
}
const TM_LANE_C = { EXP:'#5EA0D8', Jungle:'#4CB87A', Mid:'#A78BFA', Gold:'#C89050', Roam:'#D87880' };
function _tmOverviewHTML(teamName, I, sc) {
  if (!window.WIntel) return '<div class="tm-empty">Loading…</div>';
  if (!I || !I.n) return `<div class="tm-sec"><div class="tm-empty">No official games for ${esc(teamName)} in ${esc(sc.label||'the data')} yet. Log matches in Scout to build this profile.</div></div>`;
  const pc = v => Math.round(v*100);
  const lanes = WIntel.LANES.filter(l => I.lanes[l]).map(l => {
    const L = I.lanes[l];
    return `<div class="tm-lane" style="--lc:${TM_LANE_C[l]};">
      <div class="ln">${l}</div>
      <div class="pl" title="Main player">${esc(L.main || '—')}</div>
      ${L.top.slice(0,3).map(x => `<div class="hr">${tmHeroImg(x.hero)}<span>${esc(x.hero)}</span><span class="rec">${x.w}-${x.g-x.w}</span></div>`).join('')}
    </div>`;
  }).join('');
  const lv = WIntel.levers(I);
  const cfc = c => c==='strong'?'#34D399':c==='solid'?'#5EA0D8':'var(--text3)';
  const lvHTML = lv.length ? lv.slice(0,6).map(l => `<div class="tm-lv">${(l.heroes||[])[0]?tmHeroImg(l.heroes[0]):'<span style="width:24px;flex-shrink:0;"></span>'}<div><div class="t">${esc(l.text)}<span class="tm-cf" style="color:${cfc(l.conf)};">${l.conf}</span></div><div class="w">${esc(l.why)}</div></div></div>`).join('')
    : '<div class="tm-empty" style="padding:8px;">No weakness with enough evidence yet.</div>';
  const sigNames = new Set(I.signature.slice(0,5).map(x => x.hero));
  const edges = WIntel.edges(I).filter(e => ![...sigNames].some(h => e.startsWith(h + ' ')));   // signature heroes are already listed
  const sig = I.signature.slice(0,5).map(x => `<div class="tm-lv">${tmHeroImg(x.hero)}<div><div class="t">${esc(x.hero)}${x.lane?` <span style="font-weight:500;color:var(--text3);">· ${esc(x.lane)}</span>`:''}</div><div class="w">${x.w}-${x.g-x.w} · ${pc(x.wr)}% in ${x.g} games</div></div></div>`).join('');
  const games = (sc.pool||[]).filter(m => m.blueTeam===teamName || m.redTeam===teamName).sort((a,b)=>(Date.parse(b.date||'')||0)-(Date.parse(a.date||'')||0)).slice(0,8).map(m => {
    const sd = m.blueTeam===teamName ? 'blue' : 'red', opp = sd==='blue' ? m.redTeam : m.blueTeam, won = m.winner===sd;
    const d = WIntel.mins(m.duration);
    return `<div class="g"><span class="tm-wl ${won?'w':'l'}">${won?'W':'L'}</span>
      <span class="vs">${tmLogo(opp,24)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">vs ${esc(opp)}</span><span class="m">${esc((m.date||'').slice(5,10))}${d?' · '+Math.round(d)+'m':''} · ${sd}</span></span>
      <span class="pk">${(m[sd+'Picks']||[]).map(p => tmHeroImg(p.name||p)).join('')}</span></div>`;
  }).join('');
  const t = [];
  if (I.dur.avgWin && I.dur.avgLoss) t.push(`Wins avg ${I.dur.avgWin.toFixed(1)} min · losses ${I.dur.avgLoss.toFixed(1)} min`);
  if (I.ft.g) t.push(`First Turtle ${pc(I.ft.got/I.ft.g)}%`);
  if (I.fb.g) t.push(`First Blood ${pc(I.fb.got/I.fb.g)}%`);
  if (I.turtle.all) t.push(`Turtles ${pc(I.turtle.ours/I.turtle.all)}%`);
  if (I.lord.all) t.push(`Lords ${pc(I.lord.ours/I.lord.all)}%`);
  const fp = Object.entries(I.firstPicks).sort((a,b)=>b[1]-a[1]).slice(0,4);
  return `
    ${lanes ? `<div class="tm-sec"><h3>Lineup <span class="n">main player per lane · most-played heroes</span></h3><div class="tm-lineup">${lanes}</div></div>` : ''}
    <div class="tm-2col">

        ${edges.length?`<h3 style="margin-top:14px;">Strengths</h3>${edges.map(e=>`<div class="w" style="font-size:12px;color:var(--text2);padding:3px 0;">• ${esc(e)}</div>`).join('')}`:''}
        ${fp.length?`<h3 style="margin-top:14px;">First picks</h3><div class="tm-tempo">${fp.map(([h,c])=>`<span>${esc(h)} ×${c}</span>`).join('')}</div>`:''}
      </div>
    </div>
    <div class="tm-2col">
      <div class="tm-sec tm-games"><h3>Recent games <span class="n">newest first</span></h3>${games || '<div class="tm-empty">No games.</div>'}</div>
      <div class="tm-sec"><h3>Tempo</h3>${t.length?`<div class="tm-tempo">${t.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'<div class="tm-empty" style="padding:8px;">Log game length, Turtle, Lord and First Blood in Scout to see tempo.</div>'}

}

// ── Per-season roster (explicit, from team_rosters) ──
function _teamRosterSeasons(teamName) {
  const fromRoster  = (_teamRoster||[]).map(r => r.season);
  const fromMatches = (allMatches||[]).filter(m => m.blueTeam===teamName || m.redTeam===teamName).map(m => (m.season||'').trim());
  return [...new Set([...fromRoster, ...fromMatches, _rosterSeason].filter(Boolean))]
    .sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
}
function _rosterSeasonBarHTML(teamName, canManage) {
  const ss = _teamRosterSeasons(teamName);
  const label = `<span style="font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-right:2px;">Season</span>`;
  const chips = ss.map(s=>`<button class="btn btn-sm ${_rosterSeason===s?'btn-accent':'btn-ghost'}" style="border-radius:999px;padding:4px 12px;" onclick="setRosterSeason('${esc(s)}')">${esc(s)}</button>`).join('');
  const add   = canManage ? `<button class="btn btn-ghost btn-sm" style="border-radius:999px;padding:4px 12px;" onclick="addRosterSeason('${esc(teamName)}')">+ Add Season</button>` : '';
  if (!ss.length && !canManage) return '<span style="font-size:12px;color:var(--text3);">No seasons yet.</span>';
  return label + chips + add;
}
// Players detected in this team's tagged match data for a given season — used to
// surface old-season players who were never written to the explicit roster table.
function _derivedRosterPlayers(teamName, season) {
  const map = {};
  (allMatches||[]).forEach(m => {
    if ((m.season||'').trim() !== season) return;
    const sides = [];
    if (m.blueTeam===teamName) sides.push(m.bluePicks||[]);
    if (m.redTeam ===teamName) sides.push(m.redPicks ||[]);
    sides.forEach(picks => picks.forEach(p => {
      const ign = (p.player||'').trim(); if (!ign) return;
      const k = ign.toLowerCase();
      if (!map[k]) map[k] = { ign, role:p.lane||'', games:0 };
      map[k].games++;
      if (p.lane && !map[k].role) map[k].role = p.lane;
    }));
  });
  return Object.values(map).sort((a,b)=>b.games-a.games);
}

function _tmAvatar(ign, role) {
  const c = TM_LANE_C[role] || '#5E5CE6';
  return `<span class="tm-av" style="background:linear-gradient(135deg,${c},${c}99);">${esc((ign||'?')[0].toUpperCase())}</span>`;
}
// A player's three most-played heroes this roster season, with their record.
function _tmPlayerHeroes(ign) {
  try {
    const { total } = WDB.computePlayerHeroPool(allMatches, ign, { season: _rosterSeason });
    const top = Object.entries(total || {}).sort((a,b) => b[1].games - a[1].games).slice(0, 3);
    if (!top.length) return '';
    return `<span class="tm-ph">${top.map(([h, x]) => `<span title="${esc(h)} ${x.wins}-${x.games-x.wins}">${tmHeroImg(h)}</span>`).join('')}</span>`;
  } catch (_) { return ''; }
}
function _rosterSeasonHTML(teamName, canManage) {
  if (!_rosterSeason) return `<div style="font-size:12px;color:var(--text3);padding:10px;">Pick a season above${canManage?', or <b>+ Add Season</b> to start this team\'s roster':''}.</div>`;
  const rows = (_teamRoster||[]).filter(r => r.season === _rosterSeason);
  const prevWithData = _teamRosterSeasons(teamName).filter(s => s!==_rosterSeason && (_teamRoster||[]).some(r=>r.season===s));
  const copyBtn = (canManage && !rows.length && prevWithData.length)
    ? `<div style="margin-bottom:10px;"><button class="btn btn-ghost btn-sm" onclick="copyRosterFromPrev('${esc(teamName)}','${esc(prevWithData[0])}')">⧉ Copy roster from ${esc(prevWithData[0])}</button></div>` : '';

  const active = rows.filter(r=>r.is_active!==false), former = rows.filter(r=>r.is_active===false);
  const item = r => `<div class="player-row">
    ${_tmAvatar(r.ign, r.role)}
    <div class="player-info"><div class="player-ign">${esc(r.ign)}</div><div class="player-real">${r.role?`<span style="color:${TM_LANE_C[r.role]||'var(--text3)'};font-weight:600;">${esc(r.role)}</span>`:'—'}${r.real_name?' · '+esc(r.real_name):''}</div></div>
    ${_tmPlayerHeroes(r.ign)}
    <span class="player-status ${r.is_active!==false?'active':'inactive'}">${r.is_active!==false?'Active':'Former'}</span>
    ${canManage?`<div class="player-actions"><button class="btn btn-ghost btn-sm" onclick="toggleRosterActive('${r.id}')">${r.is_active!==false?'Bench':'Reactivate'}</button><button class="btn btn-red btn-sm" onclick="removeRosterPlayerUI('${r.id}','${esc(r.ign)}')">✕</button></div>`:''}
  </div>`;

  // Detected-from-matches players not already in the explicit roster for this season.
  const inRoster = new Set(rows.map(r => (r.ign||'').toLowerCase()));
  const detected = _derivedRosterPlayers(teamName, _rosterSeason).filter(d => !inRoster.has(d.ign.toLowerCase()));
  let detectedHTML = '';
  if (detected.length) {
    const dItem = d => `<div class="player-row" style="opacity:.85;">
      <div class="player-info"><div class="player-ign">${esc(d.ign)}</div><div class="player-real">${d.role?esc(d.role)+' · ':''}${d.games} game${d.games!==1?'s':''} in ${esc(_rosterSeason)}</div></div>
      ${canManage?`<div class="player-actions"><button class="btn btn-ghost btn-sm" onclick="importRosterPlayer('${esc(teamName)}','${esc(d.ign).replace(/'/g,"\\'")}','${esc(d.role||'')}')">＋ Add to roster</button></div>`:''}
    </div>`;
    detectedHTML = `<div style="font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;">Detected in match data${canManage?` · <a href="javascript:void(0)" onclick="importAllRoster('${esc(teamName)}')" style="color:var(--accent);text-transform:none;letter-spacing:0;font-weight:700;">import all ${detected.length}</a>`:''}</div>` + detected.map(dItem).join('');
  }

  if (!rows.length && !detected.length)
    return copyBtn + `<div style="font-size:12px;color:var(--text3);padding:6px 0;">No players in ${esc(_rosterSeason)} yet.${canManage?' Add players below'+(prevWithData.length?' or copy a previous season.':'.'):''}</div>`;

  const rosterHTML = active.map(item).join('') + (former.length ? `<div style="font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;">Former</div>` + former.map(item).join('') : '');
  return copyBtn + rosterHTML + detectedHTML;
}
function _renderRosterTab() {
  const can = WAdmin.canManageTeam(activeTeam);
  const bar = document.getElementById('rosterSeasonBar'); if (bar) bar.innerHTML = _rosterSeasonBarHTML(activeTeam, can);
  const list = document.getElementById('rosterList');    if (list) list.innerHTML = _rosterSeasonHTML(activeTeam, can);
  const tog = document.getElementById('addPlayerToggle'); const b = tog && tog.querySelector('button');
  if (b) { b.disabled = !_rosterSeason; b.textContent = '+ Add Player' + (_rosterSeason?' to '+_rosterSeason:''); }

function setRosterSeason(v) { _rosterSeason = v || ''; _renderRosterTab(); }
async function addRosterSeason(teamName) {
  const name = (prompt('New season for ' + teamName + ' (e.g. Season 18):', '') || '').trim();
  if (!name) return;
  _rosterSeason = name;
  _renderRosterTab();
  toast('Season "' + name + '" — now add players or copy a previous roster');
}
async function _reloadRoster() { try { _teamRoster = await WDB.loadTeamRoster(activeTeam); } catch(e) {} _renderRosterTab(); }
async function addRosterPlayer(teamName) {
  if (!_rosterSeason) { toast('Add or pick a season first', 'error'); return; }
  const ign  = document.getElementById('newIgN')?.value.trim();
  const real = document.getElementById('newRealName')?.value.trim();
  const role = document.getElementById('newRole')?.value;
  if (!ign) { toast('IGN required', 'error'); return; }
  try {
    await WDB.saveRosterPlayer({ team_name: teamName, season: _rosterSeason, ign, real_name: real, role, is_active: true });
    ['newIgN','newRealName'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
    const rl=document.getElementById('newRole'); if(rl) rl.value='';

    toast('Added ' + ign + ' to ' + _rosterSeason);
    await _reloadRoster();
  } catch(e) { toast(/team_rosters/.test(e.message)?'Run migration 018 first':e.message, 'error'); }
}
async function toggleRosterActive(id) {
  const r = (_teamRoster||[]).find(x => x.id === id); if (!r) return;
  try { await WDB.saveRosterPlayer({ id:r.id, team_name:r.team_name, season:r.season, ign:r.ign, real_name:r.real_name, role:r.role, is_active: !(r.is_active!==false) }); await _reloadRoster(); }
  catch(e) { toast(e.message, 'error'); }
}
async function removeRosterPlayerUI(id, ign) {
  if (!confirm('Remove ' + ign + " from " + _rosterSeason + "'s roster?")) return;
  try { await WDB.removeRosterPlayer(id); toast('Removed ' + ign); await _reloadRoster(); }
  catch(e) { toast(e.message, 'error'); }
}
async function copyRosterFromPrev(teamName, fromSeason) {
  try { const n = await WDB.copyRosterSeason(teamName, fromSeason, _rosterSeason); toast('Copied ' + n + ' players from ' + fromSeason); await _reloadRoster(); }
  catch(e) { toast(/team_rosters/.test(e.message)?'Run migration 018 first':e.message, 'error'); }
}
// Persist a player detected in match data into this season's explicit roster.
async function importRosterPlayer(teamName, ign, role) {
  try {
    await WDB.saveRosterPlayer({ team_name: teamName, season: _rosterSeason, ign, role: role||'', is_active: true });
    toast('Added ' + ign + ' to ' + _rosterSeason);
    await _reloadRoster();
  } catch(e) { toast(/team_rosters/.test(e.message)?'Run migration 018 first':e.message, 'error'); }
}
async function importAllRoster(teamName) {
  const inRoster = new Set((_teamRoster||[]).filter(r=>r.season===_rosterSeason).map(r=>(r.ign||'').toLowerCase()));
  const detected = _derivedRosterPlayers(teamName, _rosterSeason).filter(d => !inRoster.has(d.ign.toLowerCase()));
  if (!detected.length) return;
  try {
    for (const d of detected) await WDB.saveRosterPlayer({ team_name: teamName, season: _rosterSeason, ign: d.ign, role: d.role||'', is_active: true });
    toast('Imported ' + detected.length + ' players into ' + _rosterSeason);
    await _reloadRoster();
  } catch(e) { toast(/team_rosters/.test(e.message)?'Run migration 018 first':e.message, 'error'); }
}

          ${p.real_name ? `<div class="player-real">${esc(p.real_name)}</div>` : ''}
        </div>
        ${p.role ? `<span class="role-badge ${p.role}">${p.role}</span>` : (canManage ? '' : `<span class="role-badge">—</span>`)}
        <span class="player-status ${p.is_active !== false ? 'active' : 'inactive'}">${p.is_active !== false ? 'Active' : 'Former'}</span>
        ${canManage ? `
        <div class="player-actions">
          <select class="role-select" onchange="setPlayerRole('${p.id}', this.value)" title="Assign role">
            <option value="" ${!p.role?'selected':''}>— Role —</option>
            <option value="Gold"   ${p.role==='Gold'?'selected':''}>Gold</option>
            <option value="Jungle" ${p.role==='Jungle'?'selected':''}>Jungle</option>
            <option value="Mid"    ${p.role==='Mid'?'selected':''}>Mid</option>
            <option value="EXP"    ${p.role==='EXP'?'selected':''}>EXP</option>
            <option value="Roam"   ${p.role==='Roam'?'selected':''}>Roam</option>
          </select>
          <button class="btn btn-ghost btn-sm" onclick="togglePlayerActive('${p.id}', ${p.is_active !== false})">${p.is_active !== false ? 'Bench' : 'Reactivate'}</button>
          <button class="btn btn-red btn-sm" onclick="removePlayer('${p.id}','${esc(p.ign)}')">✕</button>
        </div>` : ''}
      </div>`).join('')}`;
  };
  return renderGroup(active, 'Active Roster') + renderGroup(inactive, 'Former / Benched');
}

function renderHeroPoolTab(teamName, players) {
  const activePlayers = players.filter(p => p.is_active !== false);
  if (!activePlayers.length) {
    return '<div class="empty-state"><div class="empty-icon">🦸</div><div>Add players to the roster first to view hero pools.</div></div>';
  }

  const leagueOpts = leagues.map(l => `<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('');
  const playerBtns = activePlayers.map(p =>
    `<button class="player-select-btn ${poolFilter.playerId === p.id ? 'selected' : ''}"
      onclick="setPoolPlayer('${p.id}')">${esc(p.ign)}</button>`).join('');

  return `
    <div class="pool-filters">
      <div style="font-size:11px;color:var(--text3);margin-right:4px;">Player:</div>
      ${playerBtns}
    </div>
    <div class="pool-filters">
      <select class="pool-filter-select" id="poolSource" onchange="updatePoolFilter()">
        <option value="all">All matches</option>
        <option value="official">Official only</option>
        <option value="scrims">Scrims only</option>
      </select>
      <select class="pool-filter-select" id="poolLeague" onchange="updatePoolFilter()">
        <option value="">All leagues</option>
        ${leagueOpts}
      </select>
      <select class="pool-filter-select" id="poolSeason" onchange="updatePoolFilter()">
        <option value="">All seasons</option>
      </select>
    </div>
    <div id="heroPoolContent">
      ${poolFilter.playerId ? renderHeroPool() : '<div class="empty-state"><div>Select a player above to view their hero pool.</div></div>'}
    </div>`;
}

function renderHeroPool() {
  if (!poolFilter.playerId) return '<div class="empty-state"><div>Select a player above.</div></div>';
  const player = allPlayers.find(p => p.id === poolFilter.playerId);
  if (!player) return '';

  const { byRole, total, games } = WDB.computePlayerHeroPool(allMatches, player.ign, {
    source: poolFilter.source,
    league: poolFilter.league,
    season: poolFilter.season,
  });

  if (!games) {
    return '<div class="empty-state"><div class="empty-icon">📭</div><div>No tagged match data found for this player.<br><span style="font-size:11px;color:var(--text3);">Tag players in Scout match entries to build their hero pool.</span></div></div>';
  }

  const LANE_COLORS = { Gold:'#C89050', Jungle:'#4CB87A', Mid:'#7C5CF6', EXP:'#5EA0D8', Roam:'#D87880', Unknown:'#8888AA' };
  const laneOrder   = ['Gold','Jungle','Mid','EXP','Roam','Unknown'];
  const orderedRoles = laneOrder.filter(l => byRole[l]).concat(Object.keys(byRole).filter(l => !laneOrder.includes(l)));

  const rows = orderedRoles.flatMap(lane => {
    const heroes = Object.entries(byRole[lane]).sort((a,b) => b[1].games - a[1].games);
    return heroes.map(([hero, stat]) => {
      const wr = stat.games ? Math.round(stat.wins / stat.games * 100) : 0;
      const c  = LANE_COLORS[lane] || '#888';
      const heroId = hero.toLowerCase().replace(/[^a-z0-9]/g,'');
      return `<tr>
        <td><div class="hero-name-cell">
          <img class="hero-portrait" src="./portraits/${heroId}.png" onerror="this.style.display='none'">
          ${esc(hero)}
        </div></td>
        <td><span class="lane-badge" style="background:${c}18;color:${c};border:1px solid ${c}44;">${esc(lane)}</span></td>
        <td>${stat.games}</td>
        <td>
          <div class="wr-bar-wrap">
            <div class="wr-bar"><div class="wr-bar-fill" style="width:${wr}%;background:${wr>=60?'var(--neon)':wr>=50?'var(--gold)':'var(--red)'};"></div></div>
            <span style="color:${wr>=60?'var(--neon)':wr>=50?'var(--text2)':'var(--red)'};">${wr}%</span>
          </div>
        </td>
      </tr>`;
    });
  });

  return `
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px;">${games} tagged game${games!==1?'s':''} found for <strong style="color:var(--text);">${esc(player.ign)}</strong></div>
    <div style="overflow-x:auto;">
    <table class="hero-pool-table">
      <thead><tr>
        <th>Hero</th><th>Lane</th><th>Games</th><th>Win Rate</th>
      </tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table></div>`;
}

// ── Tab switching ─────────────────────────────────────────────
function switchTab(name, teamName, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name)?.classList.add('active');
}

// ── Pool filter ───────────────────────────────────────────────
function setPoolPlayer(playerId) {
  poolFilter.playerId = playerId;
  document.getElementById('heroPoolContent').innerHTML = renderHeroPool();
  document.querySelectorAll('.player-select-btn').forEach(b => {
    b.classList.toggle('selected', b.getAttribute('onclick').includes(playerId));
  });
  // Update season dropdown for selected league
  updateSeasonDropdown();
}

function updatePoolFilter() {
  poolFilter.source = document.getElementById('poolSource')?.value || 'all';
  poolFilter.league = document.getElementById('poolLeague')?.value || '';
  poolFilter.season = document.getElementById('poolSeason')?.value || '';
  updateSeasonDropdown();
  if (poolFilter.playerId) document.getElementById('heroPoolContent').innerHTML = renderHeroPool();
}

function updateSeasonDropdown() {
  const sel = document.getElementById('poolSeason');
  if (!sel) return;
  const leagueName = document.getElementById('poolLeague')?.value;
  const league = leagues.find(l => l.name === leagueName);
  const filtered = league ? seasons.filter(s => s.league_id === league.id) : seasons;
  sel.innerHTML = '<option value="">All seasons</option>' +
    filtered.map(s => `<option value="${esc(s.name)}" ${poolFilter.season===s.name?'selected':''}>${esc(s.name)}</option>`).join('');
}

// ── Add / remove player ───────────────────────────────────────
function toggleAddPlayer() {
  const f = document.getElementById('addPlayerForm');
  const t = document.getElementById('addPlayerToggle');
  const isOpen = f.style.display !== 'none';
  f.style.display  = isOpen ? 'none' : 'block';
  t.style.display  = isOpen ? 'block' : 'none';
  if (!isOpen) document.getElementById('newIgN')?.focus();
}

async function addPlayer(teamName) {
  const ign      = document.getElementById('newIgN')?.value.trim();
  const realName = document.getElementById('newRealName')?.value.trim();
  const role     = document.getElementById('newRole')?.value || null;
  if (!ign) { toast('IGN required', 'error'); return; }
  try {
    const saved = await WDB.savePlayer({ ign, real_name: realName, role, team_name: teamName, is_active: true });
    allPlayers.push(saved);
    buildTeamList();
    renderTeamList();
    renderTeamDetail(teamName);
    toast(`${ign} added to ${teamName}${role ? ` (${role})` : ''}`);
  } catch(e) { toast(e.message, 'error'); }
}

async function setPlayerRole(playerId, newRole) {
  const player = allPlayers.find(p => p.id === playerId);
  if (!player) return;
  const role = newRole || null;
  try {
    const saved = await WDB.savePlayer({ ...player, role });
    Object.assign(player, saved);
    renderTeamDetail(player.team_name);
    if (document.getElementById('allPlayersView')?.style.display !== 'none') renderAllPlayers();
    toast(role ? `${player.ign} → ${role}` : `${player.ign} role cleared`);
  } catch(e) { toast(e.message, 'error'); }
}

async function togglePlayerActive(playerId, currentlyActive) {
  const player = allPlayers.find(p => p.id === playerId);
  if (!player) return;
  try {
    const updated = await WDB.savePlayer({ ...player, is_active: !currentlyActive });
    const idx = allPlayers.findIndex(p => p.id === playerId);
    if (idx !== -1) allPlayers[idx] = updated;
    renderTeamDetail(activeTeam);
    toast(updated.is_active ? `${player.ign} reactivated` : `${player.ign} benched`);
  } catch(e) { toast(e.message, 'error'); }
}

async function removePlayer(playerId, ign) {
  if (!confirm(`Remove ${ign} from the roster? This deletes the player record (match history is preserved).`)) return;
  try {
    await WDB.deletePlayer(playerId);
    allPlayers = allPlayers.filter(p => p.id !== playerId);
    buildTeamList();
    renderTeamList();
    renderTeamDetail(activeTeam);
    toast(`${ign} removed`);
  } catch(e) { toast(e.message, 'error'); }
}

// ── Add / delete team ─────────────────────────────────────────
function openAddTeam()  { document.getElementById('addTeamForm').style.display = 'block'; document.getElementById('newTeamName').focus(); }
function closeAddTeam() { document.getElementById('addTeamForm').style.display = 'none'; document.getElementById('newTeamName').value = ''; document.getElementById('newTeamRegion').value = ''; }

async function saveNewTeam() {
  const name = document.getElementById('newTeamName')?.value.trim();
  if (!name) { toast('Team name required', 'error'); return; }
  // Teams are implicit — created by adding the first player
  // Just pre-select the team name in the UI so user can add players
  if (!allTeams.find(t => t.team_name === name)) {
    allTeams.push({ team_name: name, region: '', player_count: 0 });
    allTeams.sort((a,b) => a.team_name.localeCompare(b.team_name));
  }
  closeAddTeam();
  renderTeamList();
  await selectTeam(name);
  toast(`Team "${name}" ready — add players to the roster`);
}

async function confirmDeleteTeam(teamName) {
  const count = allPlayers.filter(p => p.team_name === teamName).length;
  if (!confirm(`Delete team "${teamName}" and all ${count} player record(s)? Match history is preserved.`)) return;
  try {
    const players = allPlayers.filter(p => p.team_name === teamName);
    await Promise.all(players.map(p => WDB.deletePlayer(p.id)));
    allPlayers = allPlayers.filter(p => p.team_name !== teamName);
    buildTeamList();
    activeTeam = null;
    renderTeamList();
    document.getElementById('teamDetail').innerHTML =
      '<div class="card"><div class="empty-state"><div class="empty-icon">👥</div><div>Select a team from the list.</div></div></div>';
    toast(`Team "${teamName}" deleted`);
  } catch(e) { toast(e.message, 'error'); }
}

// ── Utils ─────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  if (type === 'error') t.style.borderColor = 'rgba(216,120,128,.4)';
  else t.style.borderColor = 'rgba(76,184,122,.35)';
  t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.transform = 'translateX(-50%) translateY(80px)'; }, 2800);
}
</script>
